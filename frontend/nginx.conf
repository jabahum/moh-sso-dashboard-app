# Included in the stock image's http context. Locations use variables so cache
# rules cannot drop security headers inherited from the server.
log_format frontend_request '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
map $uri $frontend_cache_control {
    default "no-cache";
    ~*\.(?:html|webmanifest)$ "no-store";
    ~^/(?:portal/)?(?:config(?:\.[A-Za-z0-9_-]+)?\.js|import-map(?:\.[A-Za-z0-9_-]+)?\.json|version-manifest\.json)$ "no-store";
    # Vite content-hashed assets only; stable module entries must revalidate.
    "~^/(?:portal/)?assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}
map $status $frontend_response_cache_control {
    default "no-store";
    ~^(?:200|206|304)$ $frontend_cache_control;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    large_client_header_buffers 4 32k;
    access_log /var/log/nginx/access.log frontend_request;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $frontend_response_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/json application/javascript application/manifest+json image/svg+xml;

    location = /nginx/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:map|env|log)$ { return 404; }

    # Missing code/config must be a 404, never an HTML SPA response.
    location ~ ^/(?:portal/)?(?:assets|mf|packages)/ { try_files $uri =404; }
    location ~* \.(?:js|mjs|css|json|webmanifest|wasm|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|txt|xml|html)$ {
        try_files $uri =404;
    }
    location = /portal { return 308 /portal/$is_args$args; }
    location /portal/ { try_files $uri $uri/ /portal/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
