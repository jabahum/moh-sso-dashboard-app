name: Backend Release

on:
  push:
    tags:
      - "backend/v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Backend semantic version without a prefix, for example 1.2.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  APP_NAME: moh-sso-dashboard
  VERSION_PACKAGE: github.com/moh-sso-dashboard/internal/version
  ENABLE_GITHUB_ARTIFACT_ATTESTATIONS: "false"

jobs:
  release:
    name: Verify and release backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi
          TAG="backend/v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi

      - name: Resolve release version from tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#backend/v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        shell: bash
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet backend
        run: go vet ./...

      - name: Test backend
        run: go test ./...

      - name: Check architecture boundaries
        run: go test ./internal/architecture

      - name: Check version configuration consistency
        run: ./scripts/check-version-consistency.sh

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w \
            -X '${{ env.VERSION_PACKAGE }}.Version=${VERSION}' \
            -X '${{ env.VERSION_PACKAGE }}.Commit=${COMMIT}' \
            -X '${{ env.VERSION_PACKAGE }}.BuildTime=${BUILD_TIME}' \
            -X '${{ env.VERSION_PACKAGE }}.Dirty=false'"

          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            OUTPUT="dist/${{ env.APP_NAME }}-${VERSION}-${GOOS}-${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath -ldflags="$LDFLAGS" -o "$OUTPUT" ./cmd/server
          done

          ./scripts/verify-version.sh \
            "dist/${{ env.APP_NAME }}-${VERSION}-linux-amd64" \
            "$VERSION" "$COMMIT" false

      - name: Generate checksums
        run: |
          cd dist
          sha256sum moh-sso-dashboard-* > checksums.txt

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./backend/dist
          format: spdx-json
          output-file: ./backend/dist/sbom.spdx.json

      - name: Attest release artifacts
        if: env.ENABLE_GITHUB_ARTIFACT_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: backend/dist/moh-sso-dashboard-*

      - name: Skip GitHub artifact attestation
        if: env.ENABLE_GITHUB_ARTIFACT_ATTESTATIONS != 'true'
        run: |
          echo "Skipping GitHub artifact attestation."
          echo "Set ENABLE_GITHUB_ARTIFACT_ATTESTATIONS=true after GitHub attestations are available for this org/repository."

      - name: Create verified component tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="backend/v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Backend release ${{ steps.version.outputs.version }}"
          git push origin "$TAG"

      - name: Set up Node for release notes
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate backend release notes
        working-directory: .
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-notes.mjs backend "$RELEASE_VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend/v${{ steps.version.outputs.version }}
          name: Backend ${{ steps.version.outputs.version }}
          body_path: .release/notes/backend.md
          files: backend/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release metadata
        shell: bash
        run: |
          cat > dist/release-metadata.json <<EOF
          {
            "release_tag": "backend/v${{ steps.version.outputs.version }}",
            "image_tag": "${{ steps.version.outputs.version }}",
            "version": "${{ steps.version.outputs.version }}",
            "commit": "$(git rev-parse HEAD)",
            "build_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "dirty": false
          }
          EOF

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-metadata
          path: backend/dist/release-metadata.json
