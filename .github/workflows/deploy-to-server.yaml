name: Deploy Verified Image Bundle

on:
  workflow_run:
    workflows: ["Build & Push Images"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main-branch Build & Push Images run containing deployment-bundle
        type: string
        required: true
      environment:
        description: Target environment; promote the same build run to production
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate build provenance and prepare deployment plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.AUTO_DEPLOY_STAGING == 'true')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.build.outputs.environment }}
      release_id: ${{ steps.plan.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate producing workflow and source
        id: build
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.BUILD_RUN_ID)) throw new Error('Invalid build run ID');
            if (!['staging','production'].includes(process.env.TARGET_ENVIRONMENT)) throw new Error('Invalid environment');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.BUILD_RUN_ID) });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' ||
                run.head_repository?.full_name !== repository || run.path.split('@')[0] !== '.github/workflows/build.yml') {
              throw new Error('Only successful trusted main-branch image-build runs may deploy');
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('source_commit', run.head_sha);
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput('environment', process.env.TARGET_ENVIRONMENT);
      - uses: actions/download-artifact@v4
        with:
          name: deployment-bundle
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: deployment
      - name: Validate archive, digest manifest and deployment plan
        id: plan
        env:
          SOURCE_COMMIT: ${{ steps.build.outputs.source_commit }}
          BUILD_ID: ${{ steps.build.outputs.run_id }}
          BUILD_ATTEMPT: ${{ steps.build.outputs.run_attempt }}
        run: |
          python3 infra/scripts/cd_bundle.py extract --archive deployment/deployment.tar.gz --checksum deployment/deployment.tar.gz.sha256 --destination validated
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          manifest=json.loads(Path('validated/deployment.json').read_text())
          expected=f"{os.environ['SOURCE_COMMIT']}-{os.environ['BUILD_ID']}-{os.environ['BUILD_ATTEMPT']}"
          if manifest['release_id'] != expected: raise SystemExit('Bundle/build identity mismatch')
          Path('deployment/deployment.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('release_id='+expected+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### Verified deployment plan\n\n```json\n'+json.dumps(manifest,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-ready
          path: deployment/
          retention-days: 30

  deploy:
    name: Deploy and verify selected environment
    needs: prepare
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: deployment-ready
          path: deployment
      - name: Configure pinned deployment SSH identity
        uses: ./infra/actions/ssh
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER || 'mohdeploy' }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
      - name: Upload and validate versioned infrastructure release
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/moh-sso' }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_/-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *..* ]]
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          incoming="$DEPLOY_ROOT/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$CD_SSH_CONFIG" moh-deploy "mkdir -p '$incoming'"
          scp -F "$CD_SSH_CONFIG" deployment/deployment.tar.gz deployment/deployment.tar.gz.sha256 infra/scripts/cd_bundle.py "moh-deploy:$incoming/"
          ssh -F "$CD_SSH_CONFIG" moh-deploy "python3 '$incoming/cd_bundle.py' extract --archive '$incoming/deployment.tar.gz' --checksum '$incoming/deployment.tar.gz.sha256' --destination '$DEPLOY_ROOT/releases/$RELEASE_ID'"
          echo "release_dir=$DEPLOY_ROOT/releases/$RELEASE_ID" >> "$GITHUB_ENV"
      - name: Preflight server prerequisites and private configuration
        env:
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG || '/etc/moh-sso/deploy.json' }}
        run: |
          [[ "$DEPLOY_CONFIG" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_CONFIG" != *..* ]]
          ssh -F "$CD_SSH_CONFIG" moh-deploy "python3 '$release_dir/infra/scripts/cd_server.py' preflight --config '$DEPLOY_CONFIG'"
      - name: Pull digests, back up, roll out, verify and automatically roll back on failure
        env:
          DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG || '/etc/moh-sso/deploy.json' }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          [[ "$DEPLOY_ACTOR" =~ ^[-A-Za-z0-9_]+(\[bot\])?$ ]]
          ssh -F "$CD_SSH_CONFIG" moh-deploy "python3 '$release_dir/infra/scripts/cd_server.py' deploy --config '$DEPLOY_CONFIG' --release '$release_dir' --actor '$DEPLOY_ACTOR'" | tee deployment-result.log
      - name: Record deployment outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outcome-${{ needs.prepare.outputs.environment }}
          path: deployment-result.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove runner SSH material
        if: always()
        run: |
          if [[ -n "${CD_SSH_DIR:-}" ]]; then
            rm -f "$CD_SSH_DIR/key" "$CD_SSH_DIR/known_hosts" "$CD_SSH_DIR/config"
            rmdir "$CD_SSH_DIR"
          fi
