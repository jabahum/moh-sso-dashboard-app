name: Distribution Installation Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    name: Build pinned images and verify installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend/Dockerfile
          load: true
          tags: moh-distribution-check:backend
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=distribution-backend
          cache-to: type=gha,scope=distribution-backend,mode=max
      - name: Build frontend from published production pins
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend/Dockerfile.npm-modules
          load: true
          tags: moh-distribution-check:frontend
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=distribution-frontend
          cache-to: type=gha,scope=distribution-frontend,mode=max
      - name: Distribution runtime and persistence
        run: python3 infra/scripts/test-distribution-runtime.py --backend-image moh-distribution-check:backend --frontend-image moh-distribution-check:frontend
      - name: Real Keycloak authentication, manifests and restart recovery
        run: python3 infra/scripts/test-distribution-auth.py --backend-image moh-distribution-check:backend
      - name: Deployment archive and transaction contracts
        run: python3 infra/scripts/test-cd.py
      - name: Real container deployment and rollback
        run: |
          python3 infra/scripts/test-cd-runtime.py
          python3 infra/scripts/test-cd-runtime.py --mode distribution
