name: Distribution Installation Checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Deployment archive contracts (test-cd.py) run in `make infra-check`, and the
# fixture-based rollout and rollback tests (test-cd-runtime.py, both modes) run
# in the Container Deployment Recovery job. This workflow covers only the
# checks that need the real candidate images, split so they run in parallel.
jobs:
  installation:
    name: Build pinned images and verify installation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend/Dockerfile
          load: true
          tags: moh-distribution-check:backend
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=distribution-backend
          cache-to: type=gha,scope=distribution-backend,mode=max
      - name: Verify backend image metadata and runtime layout
        run: sh infra/scripts/verify-backend-image.sh moh-distribution-check:backend 0.0.0-ci "${{ github.sha }}"
      - name: Build frontend from published production pins
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend/Dockerfile.npm-modules
          load: true
          tags: moh-distribution-check:frontend
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=distribution-frontend
          cache-to: type=gha,scope=distribution-frontend,mode=max
      - name: Distribution runtime and persistence
        run: python3 infra/scripts/test-distribution-runtime.py --backend-image moh-distribution-check:backend --frontend-image moh-distribution-check:frontend

  authentication:
    name: Keycloak authentication against the backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Only reads the layer cache; the installation job writes the same scope.
      - name: Build backend candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend/Dockerfile
          load: true
          tags: moh-distribution-check:backend
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=distribution-backend
      - name: Real Keycloak authentication, manifests and restart recovery
        run: python3 infra/scripts/test-distribution-auth.py --backend-image moh-distribution-check:backend
      - name: Verify core-only startup without optional providers
        run: python3 infra/scripts/test-distribution-auth.py --backend-image moh-distribution-check:backend --profile core
