name: Build & Push Images

on:
  push:
    branches: [main]
    tags:
      - "backend/v*.*.*"
      - "frontend/v*.*.*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_REPO: ${{ github.event.repository.name }}

jobs:
  validate:
    name: Validate before publishing images
    uses: ./.github/workflows/pr-check.yml

  docker-build-push:
    name: Build & Push (${{ matrix.service }})
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: infra/docker/backend/Dockerfile
            suffix: backend
          - service: frontend
            context: .
            dockerfile: infra/docker/frontend/Dockerfile
            suffix: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: sha
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Calculate backend build metadata
        id: backend-meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-dev.${SHORT_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/backend/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/backend/v}"
          fi
          {
            echo "version=$VERSION"
            echo "commit=$GITHUB_SHA"
            echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Calculate frontend build metadata
        id: frontend-meta
        shell: bash
        run: |
          SHELL_VERSION="$(node -p "require('./frontend/apps/shell/package.json').version")"
          VERSION="${SHELL_VERSION%%[-+]*}-dev.${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/frontend/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/frontend/v}"
            if [[ "$VERSION" != "$SHELL_VERSION" ]]; then
              echo "Frontend tag $VERSION does not match shell version $SHELL_VERSION"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch on tag only)
        if: startsWith(github.ref, 'refs/tags/backend/v')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-${{ matrix.suffix }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.backend-meta.outputs.version }},enable=${{ matrix.service == 'backend' && startsWith(github.ref, 'refs/tags/backend/v') }}
            type=raw,value=${{ steps.frontend-meta.outputs.version }},enable=${{ matrix.service == 'frontend' && startsWith(github.ref, 'refs/tags/frontend/v') }}

      - name: Build and push backend
        id: build_backend
        if: matrix.service == 'backend' && !startsWith(github.ref, 'refs/tags/frontend/v')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ startsWith(github.ref, 'refs/tags/backend/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.backend-meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.backend-meta.outputs.version }}
            COMMIT=${{ steps.backend-meta.outputs.commit }}
            BUILD_TIME=${{ steps.backend-meta.outputs.build_time }}
            DIRTY=false
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-${{ matrix.suffix }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-${{ matrix.suffix }}:buildcache,mode=max

      - name: Build and push frontend
        id: build_frontend
        if: matrix.service == 'frontend' && !startsWith(github.ref, 'refs/tags/backend/v')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.frontend-meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.frontend-meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.frontend-meta.outputs.build_time }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-${{ matrix.suffix }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-${{ matrix.suffix }}:buildcache,mode=max

      - name: Verify frontend runtime metadata
        if: matrix.service == 'frontend' && !startsWith(github.ref, 'refs/tags/backend/v')
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-frontend@${{ steps.build_frontend.outputs.digest }}"
          docker pull "$IMAGE"
          docker run --rm --entrypoint jq "$IMAGE" \
            --arg version "${{ steps.frontend-meta.outputs.version }}" \
            --arg commit "${{ github.sha }}" \
            -e '.service.version == $version and .service.commit == $commit' \
            /usr/share/nginx/html/version-manifest.json

      - name: Verify backend runtime metadata
        if: matrix.service == 'backend' && !startsWith(github.ref, 'refs/tags/frontend/v')
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-backend@${{ steps.build_backend.outputs.digest }}"
          docker pull "$IMAGE"
          OUTPUT="$(docker run --rm "$IMAGE" --version)"
          echo "$OUTPUT"
          grep -F "moh-sso-dashboard-backend ${{ steps.backend-meta.outputs.version }} " <<< "$OUTPUT"
          grep -F "commit ${{ steps.backend-meta.outputs.commit }}," <<< "$OUTPUT"
          grep -F "dirty=false" <<< "$OUTPUT"

      - name: Record verified component image
        if: github.ref == 'refs/heads/main'
        env:
          COMPONENT: ${{ matrix.service }}
          REPOSITORY: ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_REPO }}-${{ matrix.suffix }}
          DIGEST: ${{ steps.build_backend.outputs.digest || steps.build_frontend.outputs.digest }}
          VERSION: ${{ matrix.service == 'backend' && steps.backend-meta.outputs.version || steps.frontend-meta.outputs.version }}
        run: |
          mkdir -p image-metadata
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          component=os.environ['COMPONENT']
          data={'repository':os.environ['REPOSITORY'].lower(),'digest':os.environ['DIGEST'],
                'tag':'sha-'+os.environ['GITHUB_SHA'][:7], 'version':os.environ['VERSION'],
                'commit':os.environ['GITHUB_SHA']}
          Path('image-metadata',component+'.json').write_text(json.dumps(data,indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: component-image-${{ matrix.service }}
          path: image-metadata/${{ matrix.service }}.json
          overwrite: true
          retention-days: 30

  bundle:
    name: Package verified image pair and deployment configuration
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: component-image-*
          merge-multiple: true
          path: image-metadata
      - name: Package immutable deployment bundle
        run: python3 infra/scripts/cd_bundle.py package --metadata-dir image-metadata --output deployment --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: deployment/
          overwrite: true
          retention-days: 30
