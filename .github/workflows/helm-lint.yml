name: Helm Lint

on:
  pull_request:
    paths:
      - "infra/helm/**"
  push:
    branches: [main]
    paths:
      - "infra/helm/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Helm Lint (base)
        run: helm lint infra/helm/moh-sso

      - name: Helm Template (Dev)
        run: helm template test infra/helm/moh-sso -f infra/helm/moh-sso/values-dev.yaml

      - name: Helm Template (Prod)
        run: helm template test infra/helm/moh-sso -f infra/helm/moh-sso/values-prod.yaml --set backend.image.tag=1.2.3 --set frontend.image.tag=1.2.3
