name: PR Quality Checks

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx:
    name: Production Nginx contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: BACKEND_TAG=1.2.3 FRONTEND_TAG=1.2.3 make compose-config COMPOSE_ENV=gateway ENV_FILE=infra/env/prod.env.example
      - name: Validate production and development environment contracts
        run: make infra-check
      - name: Exercise production Nginx
        run: make infra-nginx-check
      - name: Exercise production container startup and development readiness
        run: make infra-runtime-check

  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ========================
      # FRONTEND
      # ========================
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate lockfile before installing dependencies
        working-directory: frontend
        run: node scripts/check-lockfile.mjs

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Dependency guard regression tests
        working-directory: frontend
        run: npm run test:dependency-guards

      - name: Frontend version consistency
        working-directory: frontend
        run: npm run version:audit && npm run audit:packages && node --test scripts/test-versioning.mjs

      - name: Local SSO startup contracts
        run: python3 infra/scripts/local-sso.test.py

      - name: Release tooling tests
        run: node --test scripts/release.test.mjs scripts/auto-release.test.mjs scripts/release-notes.test.mjs

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Report scheduler parameters and permissions
        working-directory: frontend
        run: node --test scripts/report-scheduler-parameters.test.mjs scripts/report-scheduler-permissions.test.mjs

      - name: Frontend architecture and configuration
        working-directory: frontend
        run: |
          npm run config:validate
          npm run architecture:check
          npm run mf:doctor
          npm run rbac:doctor
          npm run audit:packages

      - name: Deployment verifier tests
        run: node --test infra/scripts/verify-frontend-deployment.test.mjs

  backend-quality:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache-dependency-path: backend/go.sum

      - name: Backend vet
        working-directory: backend
        run: go vet ./...

      - name: API contract freshness
        run: make contracts-check

      - name: Backend test
        working-directory: backend
        run: go test ./...

      - name: Backend version consistency
        working-directory: backend
        run: ./scripts/check-version-consistency.sh

  quality:
    name: Fast Quality Gate
    needs: [frontend-quality, backend-quality]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the existing combined required-check result
        env:
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success

  frontend-runtime:
    name: Production Frontend Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      FRONTEND_ASSET_BASE_URL: /portal
      FRONTEND_BASE_PATH: /portal
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate lockfile before installing dependencies
        run: node scripts/check-lockfile.mjs
      - run: npm ci
      - name: Build production runtime
        run: |
          npm run config:prod
          npm run build:docker
      - name: Verify staged modules and bundle budgets
        run: |
          npm run audit:import-map
          npm run runtime:verify
          npm run bundle:budget
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  workflow-lint:
    name: Workflow and Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache: false
      - name: Install pinned workflow checker and ShellCheck
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          command -v shellcheck || { sudo apt-get update; sudo apt-get install -y shellcheck; }
      - name: Check workflow expressions and deployment shell scripts
        run: make workflow-check

  migrations:
    name: Database Migration Paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
          cache-dependency-path: backend/go.sum
      - name: Fresh install and previous-schema upgrade
        run: make migrations-check

  deployment-recovery:
    name: Container Deployment Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise rollout and recovery with isolated image/container fixtures
        run: make cd-runtime-check
