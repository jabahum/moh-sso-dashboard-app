name: PR Quality Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ========================
      # FRONTEND
      # ========================
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend version consistency
        working-directory: frontend
        run: npm run version:audit && npm run audit:packages && node --test scripts/test-versioning.mjs

      - name: Local SSO startup contracts
        run: python3 scripts/local-sso.test.py

      - name: Release tooling tests
        run: node --test scripts/release.test.mjs scripts/auto-release.test.mjs scripts/release-notes.test.mjs

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Report scheduler parameters and permissions
        working-directory: frontend
        run: node --test scripts/report-scheduler-parameters.test.mjs scripts/report-scheduler-permissions.test.mjs

      - name: Frontend architecture and configuration
        working-directory: frontend
        run: |
          npm run config:validate
          npm run architecture:check
          npm run mf:doctor
          npm run rbac:doctor
          npm run audit:packages

      - name: Deployment verifier tests
        run: node --test scripts/verify-frontend-deployment.test.mjs

      # ========================
      # BACKEND
      # ========================
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - name: Backend vet
        working-directory: backend
        run: go vet ./...

      - name: Backend test
        working-directory: backend
        run: go test ./...

      - name: Backend version consistency
        working-directory: backend
        run: ./scripts/check-version-consistency.sh

  frontend-runtime:
    name: Production Frontend Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      FRONTEND_ASSET_BASE_URL: /portal
      FRONTEND_BASE_PATH: /portal
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build production runtime
        run: |
          npm run config:prod
          npm run build:docker
      - name: Verify staged modules and bundle budgets
        run: |
          npm run audit:import-map
          npm run runtime:verify
          npm run bundle:budget
