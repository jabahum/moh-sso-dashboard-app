name: PR Quality Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # ========================
      # FRONTEND
      # ========================
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend version consistency
        working-directory: frontend
        run: npm run version:audit && npm run audit:packages && node --test scripts/test-versioning.mjs

      - name: Release tooling tests
        run: node --test scripts/release.test.mjs scripts/auto-release.test.mjs scripts/release-notes.test.mjs

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      # ========================
      # BACKEND
      # ========================
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - name: Backend vet
        working-directory: backend
        run: go vet ./...

      - name: Backend test
        working-directory: backend
        run: go test ./...

      - name: Backend version consistency
        working-directory: backend
        run: ./scripts/check-version-consistency.sh
