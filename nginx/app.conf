# Whole-host portal gateway. Shared hosts must route only /portal/ and
# /ssobackend/ to this gateway; see docs/deployment.md.
server {
  listen 80 default_server;
  server_name _;
  absolute_redirect off;
  client_max_body_size 50m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Request-ID $request_id always;
  add_header Cache-Control $gateway_cache_control always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Overwrite untrusted chains instead of appending client-controlled addresses.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 120s;
  # Legacy SSO responses can still carry multiple large token cookies.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  proxy_cache off;
  proxy_hide_header X-Request-ID;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Cache-Control;

  location = /nginx/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Strip the external prefix without changing methods, bodies or queries.
  location = /ssobackend { return 308 /ssobackend/$is_args$args; }
  location ^~ /ssobackend/ {
    proxy_pass http://backend_upstream/;
    proxy_redirect ~^(/.*)$ /ssobackend$1;
  }
  location = /backend { return 308 /backend/$is_args$args; }
  location ^~ /backend/ {
    proxy_pass http://backend_upstream/;
    proxy_redirect ~^(/.*)$ /backend$1;
  }
  location /api/ { proxy_pass http://backend_upstream; }
  location = /swagger { proxy_pass http://backend_upstream; }
  location /swagger/ { proxy_pass http://backend_upstream; }
  location = /health { proxy_pass http://backend_upstream; }
  location /health/ { proxy_pass http://backend_upstream; }
  location = /version { proxy_pass http://backend_upstream; }

  location = /portal { return 308 /portal/$is_args$args; }
  location / { proxy_pass http://frontend_upstream; }
}
