user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Exclude query strings: SSO callbacks and signed links contain secrets.
  log_format production escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log production;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  reset_timedout_connection on;
  large_client_header_buffers 4 32k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript
             application/manifest+json image/svg+xml application/xml;

  # Docker DNS: recover when a replaced container receives a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  upstream backend_upstream {
    zone backend 64k;
    server backend:9000 resolve;
    keepalive 32;
  }
  upstream frontend_upstream {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 32;
  }

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  include /etc/nginx/trusted-proxies.conf;
  map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }
  map $uri $gateway_cache_control {
    default $upstream_http_cache_control;
    ~^/(?:ssobackend|backend|api|swagger|health)(?:/|$) "no-store";
    /version "no-store";
  }

  include /etc/nginx/conf.d/*.conf;
}
