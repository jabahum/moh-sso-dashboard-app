# Include ONCE inside the host Nginx http {} context. No Docker DNS required.
upstream moh_sso_host_backend {
    server 127.0.0.1:9000;
    keepalive 32;
}
upstream moh_sso_host_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}
map $http_upgrade $moh_sso_host_connection {
    default upgrade;
    "" "";
}
map $uri $moh_sso_host_cache_control {
    default $upstream_http_cache_control;
    ~^/ssobackend(?:/|$) "no-store";
}
# Avoid SSO codes, signed query parameters, cookies and authorization headers.
log_format moh_sso_host escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":$status,"duration":$request_time,"upstream_status":"$upstream_status"}';
