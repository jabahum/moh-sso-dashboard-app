# Include inside the EXISTING HTTPS server {}. This owns only portal paths;
# the host's / and /report-browser/ locations continue to own Report Browser.
# Install this directory at /etc/nginx/moh-sso/ first.
server_tokens off;
large_client_header_buffers 4 32k;

location = /portal {
    include /etc/nginx/moh-sso/proxy.conf;
    return 308 /portal/$is_args$args;
}
location ^~ /portal/ {
    include /etc/nginx/moh-sso/proxy.conf;
    proxy_pass http://moh_sso_host_frontend;
}
location = /ssobackend {
    include /etc/nginx/moh-sso/proxy.conf;
    return 308 /ssobackend/$is_args$args;
}
location ^~ /ssobackend/ {
    include /etc/nginx/moh-sso/proxy.conf;
    client_max_body_size 50m;
    # Trailing slash strips /ssobackend/ for the Go router.
    proxy_pass http://moh_sso_host_backend/;
    proxy_redirect ~^(/.*)$ /ssobackend$1;
}
