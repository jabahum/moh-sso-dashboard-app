# Location context. Nginx terminates TLS and connects directly to the application
# ports on either the same host or a remote application server's private IP.
# Requires Nginx >= 1.29.3; production baseline is the tested 1.30.6 release.
# Preserve the HTTPS server's existing security headers, including HSTS.
add_header_inherit merge;
absolute_redirect off;
add_header X-Request-ID $request_id always;
add_header Cache-Control $moh_sso_host_cache_control always;
access_log /var/log/nginx/moh-sso-access.log moh_sso_host;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Request-ID $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $moh_sso_host_connection;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 120s;
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
proxy_cache off;
proxy_hide_header Cache-Control;
proxy_hide_header X-Request-ID;
