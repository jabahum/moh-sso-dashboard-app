# Included in the stock image's http context. Locations use variables so cache
# rules cannot drop security headers inherited from the server.
log_format frontend_request '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
map $uri $frontend_cache_control {
    default "no-cache";
    ~*\.(?:html|webmanifest)$ "no-store";
    # Kill-switch worker that retires the old /portal/-scoped PWA worker.
    /portal/sw.js "no-store";
    ~^/(?:config(?:\.[A-Za-z0-9_-]+)?\.js|import-map(?:\.[A-Za-z0-9_-]+)?\.json|version-manifest\.json)$ "no-store";
    # Vite content-hashed assets only; stable module entries must revalidate.
    "~^/assets/.+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}
map $status $frontend_response_cache_control {
    default "no-store";
    ~^(?:200|206|304)$ $frontend_cache_control;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    large_client_header_buffers 4 32k;
    access_log /var/log/nginx/access.log frontend_request;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $frontend_response_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/json application/javascript application/manifest+json image/svg+xml;

    location = /nginx/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:map|env|log)$ { return 404; }

    # Browsers reject redirects on service-worker update fetches, so the legacy
    # /portal/ worker path serves the kill-switch worker instead of redirecting.
    location = /portal/sw.js { try_files $uri =404; }
    # The portal moved from /portal/ to /; keep old links and callbacks working.
    # Listed before the asset regexes so /portal/config.js etc. also redirect.
    # The capture never starts with / or \, so it cannot become //host (open redirect).
    location ~ ^/portal(?:/+([^/\x5c].*)?)?$ { return 308 /$1$is_args$args; }
    # Missing code/config must be a 404, never an HTML SPA response.
    location ~ ^/(?:assets|mf|packages)/ { try_files $uri =404; }
    location ~* \.(?:js|mjs|css|json|webmanifest|wasm|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|txt|xml|html)$ {
        try_files $uri =404;
    }
    location = /docs { return 308 /docs/$is_args$args; }
    location /docs/ { try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ /index.html; }
}
