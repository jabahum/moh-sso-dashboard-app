# Install as /etc/nginx/moh-sso/http.conf on the separate Nginx machine,
# replacing infra/nginx/host/http.conf. Keep the shared infra/nginx/host snippets installed.
# REQUIRED: replace BOTH example 10.0.0.20 addresses with the application
# server's actual private/VPN IPv4 (the APP_BIND_ADDRESS used by Compose).
# Nginx terminates public HTTPS; these HTTP hops require a private/VPN network.
upstream moh_sso_host_backend {
    server 10.0.0.20:9000;
    keepalive 32;
}
upstream moh_sso_host_frontend {
    server 10.0.0.20:3000;
    keepalive 32;
}
include /etc/nginx/moh-sso/http-common.conf;
