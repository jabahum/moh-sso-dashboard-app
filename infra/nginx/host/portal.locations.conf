# Include inside the portal host's HTTPS server {} (portals.health.go.ug). This
# owns / (the portal), docs and API paths; remove any existing `location /` first
# (nginx rejects duplicates). The old shared host uses
# legacy-portal-host.locations.conf instead.
# Install this directory at /etc/nginx/moh-sso/ first.
server_tokens off;
large_client_header_buffers 4 32k;

# Service-worker update fetches cannot follow redirects: serve the kill-switch
# worker that retires the old /portal/-scoped worker (frontend sends no-store).
location = /portal/sw.js {
    include /etc/nginx/moh-sso/proxy.conf;
    proxy_pass http://moh_sso_host_frontend;
}
# The portal moved from /portal/ to /; old links and callbacks redirect. The
# capture never starts with / or \, so it cannot become //host.
location ~ ^/portal(?:/+([^/\x5c].*)?)?$ {
    include /etc/nginx/moh-sso/proxy.conf;
    return 308 /$1$is_args$args;
}
location / {
    include /etc/nginx/moh-sso/proxy.conf;
    proxy_pass http://moh_sso_host_frontend;
}
location = /docs {
    include /etc/nginx/moh-sso/proxy.conf;
    return 308 /docs/$is_args$args;
}
location ^~ /docs/ {
    include /etc/nginx/moh-sso/proxy.conf;
    proxy_pass http://moh_sso_host_frontend;
}
# Go backend routes, unprefixed.
# Browsers that cached a config.js with API_BASE_URL=.../api/v1 build doubled
# /api/v1/api/v1/ URLs; send them to the real route, preserving the method.
location ^~ /api/v1/api/v1/ {
    include /etc/nginx/moh-sso/proxy.conf;
    location ~ ^/api/v1/api/v1/(.*)$ { return 308 /api/v1/$1$is_args$args; }
}

location ^~ /api/ {
    include /etc/nginx/moh-sso/proxy.conf;
    client_max_body_size 50m;
    proxy_pass http://moh_sso_host_backend;
}
location ~ ^/(?:swagger|health)(?:/|$) {
    include /etc/nginx/moh-sso/proxy.conf;
    proxy_pass http://moh_sso_host_backend;
}
location = /version {
    include /etc/nginx/moh-sso/proxy.conf;
    proxy_pass http://moh_sso_host_backend;
}
# The backend used to live under /ssobackend/; old links and callbacks redirect.
location ~ ^/ssobackend(?:/+([^/\x5c].*)?)?$ {
    include /etc/nginx/moh-sso/proxy.conf;
    return 308 /$1$is_args$args;
}
