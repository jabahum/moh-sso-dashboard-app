# Include inside the OLD shared host's HTTPS server {} (dashboards.health.go.ug)
# once the portal runs on its own host (portals.health.go.ug). Report Browser keeps
# that host's / and /report-browser/ locations; only portal paths move.
# Do not include portal.locations.conf on the old host as well.
#
# Change the target origin below if the portal uses a different host name.

# Old portal links, bookmarks and stored launch URLs. The capture never starts
# with / or \, so it cannot become //host.
location ~ ^/portal(?:/+([^/\x5c].*)?)?$ {
    return 308 https://portals.health.go.ug/$1$is_args$args;
}
# Login, launch and callback links built against the old origin. 308 keeps the
# method and body; API consumers should still move to the new origin.
location ~ ^/ssobackend(?:/+([^/\x5c].*)?)?$ {
    return 308 https://portals.health.go.ug/$1$is_args$args;
}
location ~ ^/docs(/.*)?$ {
    return 308 https://portals.health.go.ug/docs$1$is_args$args;
}
