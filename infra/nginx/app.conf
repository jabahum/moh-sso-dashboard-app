# Whole-host portal gateway. The portal is served at / and owns the host; the
# backend is served at /api/ (plus /swagger, /health, /version). See docs/deployment.md.
server {
  listen 80 default_server;
  server_name _;
  absolute_redirect off;
  client_max_body_size 50m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Request-ID $request_id always;
  add_header Cache-Control $gateway_cache_control always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Overwrite untrusted chains instead of appending client-controlled addresses.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Forwarded "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 120s;
  # Legacy SSO responses can still carry multiple large token cookies.
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  proxy_cache off;
  proxy_hide_header X-Request-ID;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Cache-Control;

  location = /nginx/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The backend used to live under /ssobackend/; old links and callbacks keep
  # working through a method-preserving redirect to the unprefixed path.
  location ~ ^/ssobackend(?:/+([^/\x5c].*)?)?$ { return 308 /$1$is_args$args; }
  location = /backend { return 308 /backend/$is_args$args; }
  location ^~ /backend/ {
    proxy_pass http://backend_upstream/;
    proxy_redirect ~^(/.*)$ /backend$1;
  }
  # Browsers that cached a config.js with API_BASE_URL=.../api/v1 build doubled
  # /api/v1/api/v1/ URLs; send them to the real route, preserving the method.
  location ^~ /api/v1/api/v1/ {
    location ~ ^/api/v1/api/v1/(.*)$ { return 308 /api/v1/$1$is_args$args; }
  }
  location /api/ { proxy_pass http://backend_upstream; }
  location = /swagger { proxy_pass http://backend_upstream; }
  location /swagger/ { proxy_pass http://backend_upstream; }
  location = /health { proxy_pass http://backend_upstream; }
  location /health/ { proxy_pass http://backend_upstream; }
  location = /version { proxy_pass http://backend_upstream; }

  # Service-worker update fetches cannot follow redirects: serve the kill-switch
  # worker that retires the old /portal/-scoped worker (frontend sends no-store).
  location = /portal/sw.js { proxy_pass http://frontend_upstream; }
  # The portal moved from /portal/ to /; old links and callbacks redirect. The
  # capture never starts with / or \, so it cannot become //host.
  location ~ ^/portal(?:/+([^/\x5c].*)?)?$ { return 308 /$1$is_args$args; }
  location / { proxy_pass http://frontend_upstream; }
}
