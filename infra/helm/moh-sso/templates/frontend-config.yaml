{{- if .Values.frontend.enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-config
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
data:
  config.js: |
    window.__APP_CONFIG__ = {
      API_BASE_URL: "{{ include "moh-sso.backend.publicUrl" . }}",
      ENVIRONMENT: "{{ include "moh-sso.environment" . }}"
    };

{{- end }}
