{{- if and .Values.keycloak.enabled (not .Values.keycloak.external.enabled) }}

# =====================================================
# Keycloak StatefulSet (Internal / Dev Only)
# =====================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-keycloak
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-keycloak

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-keycloak
        {{- include "moh-sso.labels" . | nindent 8 }}

    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}

          args:
            - start
            - --import-realm

          ports:
            - name: http
              containerPort: {{ .Values.keycloak.service.port }}

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-keycloak-config
            - secretRef:
                name: {{ .Release.Name }}-keycloak-admin
            - secretRef:
                name: {{ .Release.Name }}-keycloak-db

          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true

      volumes:
        - name: realm-import
          configMap:
            name: {{ .Release.Name }}-keycloak-realm

---
# =====================================================
# Keycloak Service
# =====================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-keycloak
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: {{ .Values.keycloak.service.port }}
  type: ClusterIP

{{- end }}
