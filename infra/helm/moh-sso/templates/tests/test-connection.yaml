{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "moh-sso.fullname" . }}-backend-test"
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:
        - "{{ include "moh-sso.fullname" . }}-backend:{{ .Values.backend.service.port }}"
  restartPolicy: Never
{{- end }}
