# ===============================
# Local Laptop (Docker Desktop)
# ===============================

global:
  namespace: sso-local

# --------------------------------------------------
# Ingress (DISABLED FOR LOCAL)
# --------------------------------------------------
ingress:
  enabled: false

# --------------------------------------------------
# Backend API
# --------------------------------------------------
backend:
  enabled: true

  image:
    repository: moh-sso-dashboard-backend
    tag: local
    pullPolicy: Never

  replicas: 1

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: "http://localhost:3000"
    AUTH_RETURN_URL_ALLOWED_ORIGINS: "http://localhost:3000"

  secrets:
    KEYCLOAK_ADMIN_CLIENT_SECRET: ""
    KEYCLOAK_WEB_CLIENT_SECRET: ""

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  hpa:
    enabled: false

  pdb:
    enabled: false

# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  enabled: true

  image:
    repository: moh-sso-dashboard-frontend
    tag: local
    pullPolicy: Never

  replicas: 1

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi

  hpa:
    enabled: false

  pdb:
    enabled: false

# --------------------------------------------------
# Application Postgres
# --------------------------------------------------
postgresApp:
  enabled: true
  auth:
    database: sso_dashboard
    username: postgres
    password: postgres

  persistence:
    enabled: true
    size: 2Gi

# --------------------------------------------------
# Keycloak Postgres
# --------------------------------------------------
postgresKeycloak:
  enabled: true
  auth:
    database: keycloak
    username: keycloak
    password: keycloak

  persistence:
    enabled: true
    size: 2Gi

# --------------------------------------------------
# Keycloak
# --------------------------------------------------
keycloak:
  enabled: true
  replicas: 1

  admin:
    username: admin
    password: admin

  config:
    KC_LOG_LEVEL: DEBUG
    KC_DB: postgres
    KC_HTTP_ENABLED: "true"
    KC_PROXY: edge
    KC_HOSTNAME: "localhost"
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_HTTPS: "false"

# --------------------------------------------------
# Redis
# --------------------------------------------------
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  persistence:
    enabled: true
    size: 1Gi

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi
