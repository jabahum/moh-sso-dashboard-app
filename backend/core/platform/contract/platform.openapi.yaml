  /api/v1/platform/notifications:
    post:
      description: 'Queues one email notification for one recipient. Requires notifications:write and an Idempotency-Key header (1-128 characters, letters, digits and . _ : -). 202 when queued; 200 with replayed true when the same key and body were already accepted; 409 when the key was used with a different body; 429 above 60 notifications per application per minute (see Retry-After).'
