info:
  description: |-
    Endpoints the MoH Integrated Health Portal offers to application backends:
    caller identity, readiness, notifications and per-user access decisions.

    Every call needs a Bearer access token from the portal's Keycloak realm with
    the platform audience (default moh-platform-api) and the capability scope the
    endpoint names. Machine clients must be bound to their application in the
    portal registry; effective scopes are the token's scopes that the binding
    also grants.

    Guide: docs/integrations/platform-api.md. Authorization rules:
    docs/platform-identity.md. Compatibility policy:
    backend/core/platform/contract/README.md.

    This file is generated from the portal's full API description and checked in
    CI, so it always matches the deployed routes.
  title: MoH Integrated Health Portal platform API
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/v1/platform/applications/{clientId}/access:
    get:
      description: Send the user's own access token. Returns the user's roles and permissions for the application now, enforcing portal-side suspension and role changes immediately. The token must carry the platform audience and identity:read and be issued to the application's interactive client; machine tokens, unknown and unassigned users are refused with 403.
      operationId: get_api_v1_platform_applications_clientId_access
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/platform.UserAccess'
                  meta:
                    properties:
                      requestId:
                        type: string
                    type: object
                  success:
                    enum:
                      - true
                    type: boolean
                required:
                  - success
                  - data
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Too Many Requests
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Service Unavailable
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Error response; error.code identifies the failure.
      summary: Current access decision for a user
      tags:
        - platform
