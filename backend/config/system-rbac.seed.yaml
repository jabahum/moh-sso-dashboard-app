          - systems:launch
  - clientId: outbreak-management
    displayName: Outbreak Management
    description: Signals, alerts, surveillance, points of entry, and case management.
    icon: warning-alt
    launchUrl: /portal/apps/outbreak-management
    category: surveillance
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    sortOrder: 10
    navigation:
      '[{"id":"signals-alerts","label":"Signals & Alerts","path":"/apps/outbreak-management/signals-alerts"},{"id":"poe-management","label":"PoE
      Management","path":"/apps/outbreak-management/poe-management"},{"id":"case-management","label":"Case Management","path":"/apps/outbreak-management/case-management"}]'
    enabled: true
    accessRoles:
      - outbreak-management_access
      - viewer
      - data_entry
      - lab_technician
      - surveillance_officer
      - manager
      - admin
      - super_admin
    roles:
      - name: outbreak-management_access
