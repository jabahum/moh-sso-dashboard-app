          - surveillance:read
          - surveillance:import
          - surveillance:manage_locations
          - surveillance:manage_alerts
          - data_quality:read
          - data_quality:write
          - data_quality:resolve
          - documents:read
          - documents:write
          - documents:process
          - document_templates:read
          - document_templates:write
          - document_templates:publish
          - storage_locations:read
