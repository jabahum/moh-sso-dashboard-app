        displayName: Surveillance Officer
        description: Surveillance officer with monitoring access
        permissions:
          - outbreak:access
          - surveillance:read
          - surveillance:import
          - surveillance:manage_alerts
  - clientId: data-statistics
    displayName: Data & Statistics
    description: Data quality, document management, reports, surveillance, and issue tracking tools.
    icon: home
    launchUrl: /portal/apps/dwh
    category: platform
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    sortOrder: 20
    navigation: |-
      [
        {"id":"dashboards","label":"Dashboards","path":"/apps/dwh/dashboards","permission":"report_browser:read","icon":"dashboard","description":"Browse approved data and reporting dashboards.","order":10,"displayInLauncher":true},
        {"id":"data-validation","label":"Data Validation","path":"/apps/dwh/data-validation","permission":"data_quality:read","icon":"action","description":"Define and run data quality validation rules.","order":20,"displayInLauncher":true},
        {"id":"data-visualizer","label":"Data Visualizer","path":"/apps/dwh/data-visualizer","permission":"data_quality:read","icon":"chart","description":"Data visualization/Export from the NDWH for all programs.","order":30,"displayInLauncher":true},
        {"id":"documents","label":"Document Management","path":"/apps/dwh/documents","permission":"documents:read","icon":"documents","description":"Upload and manage health data documents.","order":40,"displayInLauncher":true},
        {"id":"surveillance","label":"Surveillance","path":"/apps/dwh/surveillance","permission":"surveillance:read","icon":"warning-alt","description":"Review surveillance indicators, alerts, and reports.","order":50,"displayInLauncher":true},
        {"id":"issue-tracker","label":"Issue Tracking","path":"/apps/dwh/issue-tracker","permission":"issue_tracker:read","icon":"tracker","description":"Track and resolve data quality issues.","order":60,"displayInLauncher":true}
      ]
    enabled: true
    accessRoles:
      - data-statistics_access
      - report_admin
      - report_manager
      - report_analyst
      - report_viewer
      - surveillance_viewer
      - surveillance_officer
      - surveillance_data_entry
      - surveillance_manager
      - issue_tracker_viewer
      - issue_tracker_contributor
      - issue_tracker_editor
      - issue_tracker_manager
      - document_viewer
      - document_editor
      - document_processor
      - document_manager
      - document_template_viewer
      - document_template_editor
      - document_template_publisher
    roles:
      - name: data-statistics_access
        displayName: Data-Statistics Access
        description: Default access to Data & Statistics
        permissions:
          - portal:access
          - systems:read
          - systems:launch
          - data_quality:read
          - issue_tracker:read
          - documents:read
          - document_templates:read
          - storage_locations:read
          - surveillance:read
          - report_browser:read
      - name: report_admin
        displayName: Report Admin
        description: Report Browser administrator access
        permissions:
          - report_browser:read
          - metrics:read
          - audit:read
      - name: report_manager
        displayName: Report Manager
        description: Report Browser manager access
        permissions:
          - report_browser:read
          - metrics:read
      - name: report_analyst
        displayName: Report Analyst
        description: Report Browser analyst access
        permissions:
          - report_browser:read
          - data_quality:read
      - name: report_viewer
        displayName: Report Viewer
        description: Report Browser read-only access
        permissions:
          - report_browser:read
      - name: surveillance_viewer
        displayName: Surveillance Viewer
        description: Read-only surveillance dashboard access
        permissions:
          - surveillance:read
      - name: surveillance_officer
        displayName: Surveillance Officer
        description: Can monitor surveillance dashboards, import data, and manage alerts
        permissions:
          - surveillance:read
          - surveillance:import
          - surveillance:manage_alerts
      - name: surveillance_data_entry
        displayName: Surveillance Data Entry
        description: Can view surveillance dashboards and import surveillance data
        permissions:
          - surveillance:read
          - surveillance:import
      - name: surveillance_manager
        displayName: Surveillance Manager
        description: Can manage surveillance dashboards, imports, locations, and alerts
        permissions:
          - surveillance:read
          - surveillance:import
          - surveillance:manage_locations
          - surveillance:manage_alerts
      - name: issue_tracker_viewer
        displayName: Issue Tracker Viewer
        description: Read-only access to issue tracker records and history
        permissions:
          - issue_tracker:read
      - name: issue_tracker_contributor
        displayName: Issue Tracker Contributor
        description: Can view issues and add comments
        permissions:
          - issue_tracker:read
          - issue_tracker:comment
      - name: issue_tracker_editor
        displayName: Issue Tracker Editor
        description: Can create, edit, and comment on issues
        permissions:
          - issue_tracker:read
          - issue_tracker:write
          - issue_tracker:comment
      - name: issue_tracker_manager
        displayName: Issue Tracker Manager
        description: Can manage the complete issue lifecycle
        permissions:
          - issue_tracker:read
          - issue_tracker:write
          - issue_tracker:manage
          - issue_tracker:assign
          - issue_tracker:close
          - issue_tracker:reopen
          - issue_tracker:comment
      - name: document_viewer
        displayName: Document Viewer
        description: Read-only access to documents and document templates
        permissions:
          - documents:read
          - document_templates:read
          - storage_locations:read
      - name: document_editor
        displayName: Document Editor
        description: Can view, upload, update, and delete documents
        permissions:
          - documents:read
          - documents:write
          - document_templates:read
          - storage_locations:read
      - name: document_processor
        displayName: Document Processor
        description: Can view, process, and reprocess documents
        permissions:
          - documents:read
          - documents:process
          - document_templates:read
          - storage_locations:read
      - name: document_manager
        displayName: Document Manager
        description: Full document and document-template management access
        permissions:
          - documents:read
          - documents:write
          - documents:process
          - document_templates:read
          - document_templates:write
          - document_templates:publish
          - storage_locations:read
      - name: document_template_viewer
        displayName: Document Template Viewer
        description: Read-only access to document templates
        permissions:
          - documents:read
          - document_templates:read
          - storage_locations:read
      - name: document_template_editor
        displayName: Document Template Editor
        description: Can create and edit document templates and their structures
        permissions:
          - documents:read
          - document_templates:read
          - document_templates:write
          - storage_locations:read
      - name: document_template_publisher
        displayName: Document Template Publisher
        description: Can create, edit, publish, archive, and republish document templates
        permissions:
          - documents:read
          - document_templates:read
          - document_templates:write
          - document_templates:publish
          - storage_locations:read
